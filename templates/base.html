
{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Ishami Cyusa Clairon | Portfolio{% endblock %}</title>
    <meta name="description" content="Explore the portfolio of Ishami Cyusa Clairon, including projects, skills, clubs, and interests.">
    <meta name="theme-color" content="#18213a">

    <style>
        :root {
            --bg-color: #0b0f19;
            --surface-color: rgba(17, 24, 39, 0.88);
            --surface-light: #151e30;
            --border-color: rgba(255, 255, 255, 0.10);
            --text-primary: #f9fafb;
            --text-secondary: #a1a9b8;
            --accent-gradient: linear-gradient(135deg, #6366f1, #a855f7, #ec4899);
            --accent-color: #8b5cf6;
            --success-color: #4ade80;
            --danger-color: #f87171;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
            scroll-padding-top: 100px;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background:
                radial-gradient(ellipse at 10% 0%, rgba(99, 102, 241, .12), transparent 35%),
                radial-gradient(ellipse at 90% 25%, rgba(168, 85, 247, .08), transparent 30%),
                var(--bg-color);
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                Roboto, Helvetica, Arial, sans-serif;
            line-height: 1.7;
        }

        a {
            color: inherit;
        }

        img {
            max-width: 100%;
        }

        button,
        input,
        textarea,
        select {
            font: inherit;
        }

        /* NAVBAR */

        header {
            position: sticky;
            top: 0;
            z-index: 1000;
            width: 100%;
            background: rgba(31, 40, 66, .97);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border-bottom: 1px solid rgba(167, 139, 250, .45);
            box-shadow: 0 5px 25px rgba(0, 0, 0, .2);
        }

        .nav-container {
            max-width: 1150px;
            margin: 0 auto;
            padding: .65rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
        }

        .nav-brand {
            display: flex;
            align-items: center;
            gap: .65rem;
            text-decoration: none;
            flex-shrink: 0;
        }

        .nav-brand img {
            width: 62px;
            height: 62px;
            object-fit: contain;
            display: block;
        }

        .nav-brand span {
            font-size: .95rem;
            font-weight: 700;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 1.6rem;
        }

        .nav-links a {
            position: relative;
            padding: .4rem 0;
            color: #d8deef;
            text-decoration: none;
            font-size: .86rem;
            font-weight: 500;
            transition: color .2s ease;
        }

        .nav-links a::after {
            content: "";
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0;
            height: 2px;
            background: var(--accent-gradient);
            transition: width .25s ease;
        }

        .nav-links a:hover,
        .nav-links a.active {
            color: #ffffff;
        }

        .nav-links a:hover::after,
        .nav-links a.active::after {
            width: 100%;
        }

        /* MAIN LAYOUT */

        main {
            flex: 1;
            width: 100%;
            max-width: 1150px;
            margin: 0 auto;
            padding: 3.5rem 1.5rem 5rem;
        }

        .gradient-text {
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            color: transparent;
        }

        .eyebrow {
            display: inline-block;
            margin-bottom: 1rem;
            padding: .35rem .8rem;
            border: 1px solid rgba(139, 92, 246, .35);
            border-radius: 999px;
            color: #c4b5fd;
            background: rgba(139, 92, 246, .10);
            font-size: .8rem;
            font-weight: 750;
            letter-spacing: .06em;
        }

        h1, h2, h3 {
            line-height: 1.2;
            letter-spacing: -.035em;
        }

        h1 {
            font-size: clamp(2.5rem, 6vw, 4.5rem);
        }

        h2 {
            font-size: clamp(1.7rem, 4vw, 2.5rem);
        }

        h3 {
            font-size: 1.15rem;
        }

        p {
            color: var(--text-secondary);
        }

        .page-intro {
            margin-bottom: 2rem;
        }

        .page-intro p {
            max-width: 720px;
            margin-top: 1rem;
            font-size: 1.05rem;
        }

        .section {
            margin-top: 5rem;
        }

        .section-heading {
            margin-bottom: 1.5rem;
        }

        .section-heading p {
            max-width: 650px;
            margin-top: .6rem;
        }

        /* BUTTONS */

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: .5rem;
            padding: .8rem 1.3rem;
            border: 1px solid transparent;
            border-radius: 10px;
            text-decoration: none;
            text-align: center;
            font-weight: 750;
            cursor: pointer;
            transition: transform .25s ease, opacity .25s ease;
        }

        .btn:hover {
            transform: translateY(-3px);
        }

        .btn-primary {
            background: var(--accent-gradient);
            color: #fff;
            box-shadow: 0 6px 22px rgba(99, 102, 241, .25);
        }

        .btn-primary:hover {
            opacity: .92;
        }

        .btn-outline {
            color: var(--text-primary);
            background: transparent;
            border-color: var(--border-color);
        }

        .btn-outline:hover {
            border-color: var(--accent-color);
            background: rgba(139, 92, 246, .08);
        }

        .button-row {
            display: flex;
            flex-wrap: wrap;
            gap: .85rem;
            margin-top: 1.6rem;
        }

        /* HOME HERO */

        .home-hero {
            display: grid;
            grid-template-columns: 1.2fr .8fr;
            align-items: center;
            gap: 3rem;
            min-height: 420px;
        }

        .home-hero h1 {
            margin-bottom: 1rem;
        }

        .hero-description {
            max-width: 600px;
            font-size: 1.08rem;
        }

        .hero-image-wrap {
            width: 100%;
            max-width: 340px;
            justify-self: center;
            padding: 7px;
            border-radius: 28px;
            background: var(--accent-gradient);
            box-shadow: 0 20px 70px rgba(139, 92, 246, .2);
            transform: none;
        }

        .hero-image {
            display: block;
            width: 100%;
            aspect-ratio: 4 / 5;
            object-fit: cover;
            object-position: center;
            border-radius: 22px;
            background: var(--surface-light);
            transform: none;
        }

        .profile-photo {
            display: block;
            width: 100%;
            height: auto;
            max-height: 430px;
            object-fit: cover;
            object-position: center;
            border-radius: 22px;
            transform: none;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 1rem;
            margin-top: 3rem;
        }

        .stat {
            padding: 1.3rem;
            text-align: center;
            border: 1px solid var(--border-color);
            border-radius: 15px;
            background: var(--surface-color);
        }

        .stat strong {
            display: block;
            font-size: 1.6rem;
        }

        .stat span {
            color: var(--text-secondary);
            font-size: .88rem;
        }

        /* TAGS */

        .tag-list {
            display: flex;
            flex-wrap: wrap;
            gap: .5rem;
            margin-top: 1rem;
        }

        .tag {
            display: inline-block;
            padding: .25rem .7rem;
            border: 1px solid rgba(139, 92, 246, .25);
            border-radius: 999px;
            background: rgba(139, 92, 246, .10);
            color: #c4b5fd;
            font-size: .8rem;
        }

        /* CARDS */

        .card-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 1.2rem;
        }

        .card {
            min-width: 0;
            padding: 1.5rem;
            border: 1px solid var(--border-color);
            border-radius: 18px;
            background: linear-gradient(145deg, rgba(21, 31, 50, .95), rgba(11, 17, 29, .95));
            transition: transform .25s ease, border-color .25s ease, box-shadow .25s ease;
        }

        .card:hover {
            transform: translateY(-5px);
            border-color: rgba(168, 85, 247, .65);
            box-shadow: 0 12px 35px rgba(0, 0, 0, .15);
        }

        .card-icon {
            display: grid;
            place-items: center;
            width: 48px;
            height: 48px;
            margin-bottom: 1rem;
            border-radius: 14px;
            background: rgba(139, 92, 246, .15);
            font-size: 1.5rem;
        }

        .card h3 {
            margin-bottom: .6rem;
        }

        .card p {
            font-size: .95rem;
        }

        .card-link {
            display: inline-block;
            margin-top: 1rem;
            color: #c4b5fd;
            text-decoration: none;
            font-weight: 700;
        }

        .card-link:hover {
            color: #f0abfc;
        }

        /* ABOUT PAGE */

        .about-intro {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 1.5rem;
        }

        .about-panel {
            padding: 2rem;
            border: 1px solid var(--border-color);
            border-radius: 20px;
            background: var(--surface-color);
        }

        .about-panel p {
            margin-top: 1rem;
        }

        .club-card {
            min-height: 220px;
        }

        .club-type {
            display: inline-block;
            margin-top: 1rem;
            padding: .3rem .7rem;
            border-radius: 999px;
            background: rgba(139, 92, 246, .12);
            color: #c4b5fd;
            font-size: .8rem;
        }

        .about-quote {
            margin-top: 3rem;
            padding: 2rem;
            border-left: 4px solid var(--accent-color);
            border-radius: 0 16px 16px 0;
            background: rgba(139, 92, 246, .08);
        }

        /* CONTACT PAGE */

        .contact-layout {
            display: grid;
            grid-template-columns: .8fr 1.2fr;
            gap: 2rem;
            align-items: start;
        }

        .contact-info,
        .contact-form-card {
            min-width: 0;
            padding: 2rem;
            border: 1px solid var(--border-color);
            border-radius: 20px;
            background: linear-gradient(145deg, rgba(21, 31, 50, .92), rgba(11, 17, 29, .95));
        }

        .contact-info h2,
        .contact-form-card h2 {
            margin-bottom: .8rem;
        }

        .contact-detail {
            display: flex;
            align-items: flex-start;
            gap: 1rem;
            padding: 1rem 0;
            border-bottom: 1px solid var(--border-color);
        }

        .contact-detail:last-child {
            border-bottom: none;
        }

        .contact-detail-icon {
            flex-shrink: 0;
            font-size: 1.3rem;
        }

        .contact-detail strong {
            display: block;
        }

        .contact-form {
            margin-top: 1.5rem;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 1rem;
        }

        .form-field {
            min-width: 0;
            margin-bottom: 1.1rem;
        }

        .form-field.full {
            grid-column: 1 / -1;
        }

        .form-field label {
            display: block;
            margin-bottom: .45rem;
            font-size: .9rem;
            font-weight: 700;
        }

        .form-field input,
        .form-field select,
        .form-field textarea {
            width: 100%;
            padding: .9rem 1rem;
            color: var(--text-primary);
            background: #0a1120;
            border: 1px solid #29364b;
            border-radius: 10px;
            outline: none;
            font: inherit;
            transition: border-color .2s ease, box-shadow .2s ease;
        }

        .form-field input:focus,
        .form-field select:focus,
        .form-field textarea:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, .15);
        }

        .form-field textarea {
            min-height: 150px;
            resize: vertical;
        }

        .form-field select option {
            background: #0a1120;
            color: var(--text-primary);
        }

        .form-help,
        .privacy-note {
            margin-top: .45rem;
            font-size: .82rem;
        }

        .contact-form button {
            width: 100%;
        }

        .privacy-note {
            text-align: center;
            margin-top: 1rem;
        }

        /* FORM FEEDBACK */

        .notice {
            padding: 1rem 1.2rem;
            margin: 1rem 0;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            background: var(--surface-color);
        }

        .notice.success {
            color: var(--success-color);
            border-color: rgba(74, 222, 128, .45);
        }

        .notice.error {
            color: var(--danger-color);
            border-color: rgba(248, 113, 113, .45);
        }

        .notice ul {
            padding-left: 1.2rem;
        }

        /* FOOTER */

        footer {
            margin-top: auto;
            padding: 1.5rem;
            border-top: 1px solid var(--border-color);
            background: rgba(17, 24, 39, .7);
            text-align: center;
            color: var(--text-secondary);
            font-size: .88rem;
        }

        footer p {
            color: var(--text-secondary);
        }

        /* ACCESSIBILITY */

        a:focus-visible,
        button:focus-visible,
        input:focus-visible,
        textarea:focus-visible,
        select:focus-visible {
            outline: 2px solid #c4b5fd;
            outline-offset: 3px;
        }

        /* TABLET */

        @media (max-width: 760px) {
            main {
                padding: 2.5rem 1rem 4rem;
            }

            .nav-container {
                padding: .7rem 1rem;
            }

            .nav-brand img {
                width: 62px;
                height: 62px;
                object-fit: contain;
                display: block;
                background: transparent;
                border: none;
                box-shadow: none;
                mix-blend-mode: screen;
            }


            .nav-links {
                gap: 1rem;
            }

            .home-hero {
                grid-template-columns: 1fr;
                gap: 2.5rem;
            }

            .hero-image-wrap {
                width: min(80%, 300px);
            }

            .card-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }

            .about-intro,
            .contact-layout {
                grid-template-columns: 1fr;
            }

            .section {
                margin-top: 3.5rem;
            }
        }

        /* MOBILE */

        @media (max-width: 500px) {
            .nav-container {
                flex-wrap: wrap;
            }

            .nav-brand img {
                width: 48px;
                height: 48px;
            }

            .nav-brand span {
                font-size: .9rem;
            }

            .nav-links {
                width: 100%;
                justify-content: space-between;
                gap: .5rem;
            }

            .nav-links a {
                font-size: .82rem;
            }

            .card-grid,
            .stats-grid,
            .form-grid {
                grid-template-columns: 1fr;
            }

            .form-field.full {
                grid-column: auto;
            }

            h1 {
                font-size: 2.5rem;
            }

            .contact-info,
            .contact-form-card,
            .about-panel {
                padding: 1.3rem;
            }
        }

            @media (prefers-reduced-motion: reduce) {
                html {
                    scroll-behavior: auto;
                }

                *,
                *::before,
                *::after {
                    transition-duration: .01ms !important;
                    animation-duration: .01ms !important;
                }
            }
                        .site-logo {
                    width: 100%;
                    max-width: 180px;
                    height: auto;
                    display: block;
                }

                @media screen and (max-width: 480px) {
                    .site-logo {
                        max-width: 120px;
                    }
                }
    </style>

    {% block extra_head %}{% endblock %}
    {% load static %}
    <link rel="icon" type="image/png"
          href="{% static 'core/images/Regal ICC Crown and Book Emblem.png' %}?v=2">
</head>

<body>
    <header>
        {% include "partial/navbar.html" %}
    </header>

    <main>
        {% block content %}
        {% endblock %}
    </main>

    {% include "partial/footer.html" %}
</body>
</html>
