{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Portfolio{% endblock %}</title>

    <style>
        /* GENERAL STYLING */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
            scroll-padding-top: 90px;
        }

        body {
            font-family: Arial, sans-serif;
            background: #090b14;
            color: #f5f5ff;
            line-height: 1.7;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        .container {
            width: 90%;
            max-width: 1120px;
            margin: auto;
        }

        .gradient-text {
            background: linear-gradient(90deg, #c4b5fd, #a78bfa, #e879f9);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .eyebrow {
            color: #a78bfa;
            font-size: 12px;
            font-weight: bold;
            letter-spacing: 2px;
            margin-bottom: 18px;
            display: inline-block;
        }

        /* NAVIGATION */
        .site-header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(9, 11, 20, 0.95);
            border-bottom: 1px solid #25283a;
        }

        .navbar {
            min-height: 75px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
        }

        .logo {
            width: 68px;
            height: 68px;
            object-fit: contain;
            display: block;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 23px;
        }

        .nav-links a {
            color: #b1b5c8;
            font-size: 14px;
            transition: 0.3s;
        }

        .nav-links a:hover {
            color: #c4b5fd;
        }

        /* BUTTONS */
        .btn {
            display: inline-block;
            padding: 12px 19px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 14px;
            transition: 0.3s;
            cursor: pointer;
        }

        .btn:hover {
            transform: translateY(-3px);
        }

        .btn-primary {
            color: white;
            background: linear-gradient(120deg, #7c3aed, #9333ea);
            border: none;
        }

        .btn-outline {
            border: 1px solid #38344d;
            color: white;
        }

        /* CARDS / GLASS EFFECT */
        .glass-card {
            background: linear-gradient(145deg, #151928, #10131f);
            border: 1px solid #282b3b;
            border-radius: 16px;
        }

        /* CONTACT PAGE STYLING */
        .contact-hero-section {
            padding: 60px 0 100px;
        }

        .contact-header {
            text-align: center;
            max-width: 650px;
            margin: 0 auto 40px;
        }

        .contact-header h1 {
            font-size: 2.5rem;
            margin-bottom: 12px;
            line-height: 1.2;
        }

        .contact-grid {
            display: grid;
            grid-template-columns: 1fr 1.3fr;
            gap: 35px;
            align-items: start;
            max-width: 950px;
            margin: 0 auto;
        }

        .contact-info-cards {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .contact-info-card {
            padding: 20px;
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .card-icon {
            font-size: 24px;
            background: #241b3a;
            padding: 12px;
            border-radius: 12px;
        }

        .contact-info-card h3 {
            font-size: 1rem;
            margin-bottom: 3px;
            color: #fff;
        }

        .contact-info-card p {
            color: #a1a8bb;
            font-size: 0.9rem;
        }

        .contact-form-wrapper {
            padding: 35px;
        }

        .modern-contact-form {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 7px;
        }

        .form-group label {
            font-size: 0.9rem;
            color: #c4b5fd;
            font-weight: bold;
        }

        .form-group input,
        .form-group textarea {
            background: #0d101b;
            border: 1px solid #282b3b;
            padding: 12px 15px;
            border-radius: 8px;
            color: #fff;
            font-size: 0.95rem;
            font-family: inherit;
            width: 100%;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #8b5cf6;
        }

        .submit-btn {
            width: 100%;
            margin-top: 10px;
        }

        .messages-container {
            max-width: 650px;
            margin: 0 auto 25px;
        }

        .alert {
            padding: 12px 18px;
            border-radius: 8px;
            font-size: 0.9rem;
            text-align: center;
        }

        .alert-success {
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid rgba(16, 185, 129, 0.3);
            color: #34d399;
        }

        .alert-error {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #f87171;
        }

        /* FOOTER */
        .footer {
            padding: 30px 0 20px;
            border-top: 1px solid #25283a;
            margin-top: 50px;
        }

        .footer-content {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
        }

        .footer p,
        .footer a {
            color: #a1a8bb;
            font-size: 13px;
        }

        .copyright {
            text-align: center;
            margin-top: 22px;
        }

        /* RESPONSIVE */
        @media (max-width: 900px) {
            .contact-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <header class="site-header">
        {% include "partial/navbar.html" %}
    </header>

    <main>
        {% block content %}
        {% endblock %}
    </main>

    <footer class="footer">
        <div class="container footer-content">
            <p>Designed and built by Ishami Cyusa Clairon.</p>
            <a href="#home">Back to top ↑</a>
        </div>
        <p class="copyright">
            © 2026 Ishami Cyusa Clairon. All rights reserved.
        </p>
    </footer>
</body>
</html>
