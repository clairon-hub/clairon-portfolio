<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 420" role="img" aria-labelledby="title">
  <title id="title">ICC crowned monogram</title>
  <defs>
    <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3d9ff"/>
      <stop offset=".22" stop-color="#bd55ff"/>
      <stop offset=".55" stop-color="#6c00e8"/>
      <stop offset=".78" stop-color="#2a075d"/>
      <stop offset="1" stop-color="#e5aaff"/>
    </linearGradient>
    <linearGradient id="silver" x1="0" y1="0" x2=".9" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".25" stop-color="#d9d7e8"/>
      <stop offset=".5" stop-color="#7e819c"/>
      <stop offset=".72" stop-color="#f7f4ff"/>
      <stop offset="1" stop-color="#77778f"/>
    </linearGradient>
    <linearGradient id="crown" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7caff"/>
      <stop offset=".45" stop-color="#9c19ff"/>
      <stop offset="1" stop-color="#4a00ad"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2.5" result="blur"/>
      <feOffset dy="3" result="offset"/>
      <feComponentTransfer><feFuncA type="linear" slope=".45"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g filter="url(#shadow)" stroke-linejoin="round">
    <path d="M190 100 L213 48 L237 83 L250 16 L268 82 L302 48 L316 101 L287 91 L273 113 L230 113 L213 91 Z" fill="url(#crown)" stroke="#dca1ff" stroke-width="3"/>
    <path d="M205 117 Q252 129 301 117 L297 127 Q252 139 209 127 Z" fill="url(#purple)" stroke="#9b48ff" stroke-width="2"/>
    <text x="35" y="330" font-family="Georgia, 'Times New Roman', serif" font-size="280" font-weight="bold" fill="url(#purple)" stroke="#3b0879" stroke-width="3">I</text>
    <text x="120" y="315" font-family="Georgia, 'Times New Roman', serif" font-size="260" font-weight="bold" fill="url(#purple)" stroke="#3b0879" stroke-width="3">C</text>
    <text x="218" y="375" font-family="Georgia, 'Times New Roman', serif" font-size="255" font-weight="bold" fill="url(#silver)" stroke="#55566e" stroke-width="3">C</text>
  </g>
</svg>
